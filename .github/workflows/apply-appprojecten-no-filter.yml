name: Apply AppProjecten No filter

on:
  push:
    branches:
      - cursor/appprojecten-no-filter-d449
    paths:
      - .github/workflows/apply-appprojecten-no-filter.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/appprojecten-no-filter-d449
      - name: Apply patch and remove carrier files
        run: |
          set -euo pipefail
          cat .github/patches/appprojecten-no-filter.b64.part* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/app.patch
          echo "c2e38410bd3b881eafb3c1d6057ba36c382bcd7ad6f67179eea63edd3405be75  /tmp/app.patch" | sha256sum -c -
          git apply --index /tmp/app.patch
          git rm -r .github/patches
          git rm -f .github/workflows/apply-appprojecten-no-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stuur alleen een echt projectnummer naar AppProjecten.No."
          git push origin HEAD:cursor/appprojecten-no-filter-d449
